<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your Campusbite account</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 32px 16px;
      background: #faf9f6;
      font-family: Arial, sans-serif;
      color: #292e24;
    "
  >
    <div
      style="
        max-width: 480px;
        margin: auto;
        padding: 36px 28px;
        border-radius: 24px;
        background: #ffffff;
      "
    >
      <p style="margin: 0 0 32px; font-size: 24px; font-weight: 700">
        campus<span style="color: #f56b28">bite</span>
      </p>
      <h1 style="font-size: 26px; line-height: 1.3">One last step before your next good meal.</h1>
      <p style="color: #71766a; font-size: 15px; line-height: 1.7">
        Confirm your email address to finish creating your Campusbite account.
      </p>
      <p style="margin: 32px 0">
        <a
          href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email"
          style="
            display: inline-block;
            padding: 16px 24px;
            border-radius: 12px;
            background: #f56b28;
            color: #ffffff;
            font-weight: 700;
            text-decoration: none;
          "
          >Confirm my account</a
        >
      </p>
      <p style="color: #71766a; font-size: 13px; line-height: 1.7">
        After confirmation, return to Campusbite and sign in with your email and password.
      </p>
      <p style="color: #96978b; font-size: 12px; line-height: 1.6">
        If you did not create this account, you can ignore this email.
      </p>
    </div>
  </body>
</html>
